<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>🎯 Interactive JS Assignment</h1>

  <!-- Event Handling -->
  <button id="clickBtn">Click Me!</button>
  <div id="hoverBox">Hover over me!</div>
  <input type="text" id="keyInput" placeholder="Type something..." />

  <!-- Interactive Elements: Color Change -->
  <button id="colorBtn">Change My Color</button>

  <!-- Image Slider -->
  <div class="gallery">
    <div class="slider" id="slider">
      <img src="./galleryImage/img1.jpg" alt="Slide 1" />
      <img src="./galleryImage/img2.jpg" alt="Slide 2" />
      <img src="./galleryImage/img3.jpg" alt="Slide 3" />
      <img src="./galleryImage/img4.jpg" alt="Slide 4" />
     
    </div>
    <button id="nextBtn">Next</button>
  </div>

  <!-- Form Validation -->
  <form id="myForm">
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Submit</button>
    <p id="formFeedback"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
